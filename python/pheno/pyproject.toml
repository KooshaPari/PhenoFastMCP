[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pheno"
version = "0.1.0"
description = "Phenotype framework glue layer for FastMCP (absorbed from McpKit/AgentMCP)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "KooshaPari" },
]
keywords = [
    "mcp",
    "fastmcp",
    "pheno",
    "phenotype",
    "framework",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastmcp-slim[client,server]>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/KooshaPari/PhenoFastMCP"
Repository = "https://github.com/KooshaPari/PhenoFastMCP"
"Server implementations" = "https://github.com/KooshaPari/PhenoMCPServers"

[tool.hatch.build.targets.wheel]
packages = ["src/pheno"]

[tool.ruff.lint]
ignore = [
    "COM812",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
